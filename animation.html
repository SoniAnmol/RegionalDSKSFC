<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Italy Labour Supply Animation – Regional-DSK Project">
    <meta name="author" content="Anmol Soni">
    <title>Italy Labour Supply Animation | Regional-DSK</title>
    <link rel="stylesheet" href="style.css">
    <style>
        html,
        body {
            height: 100%;
        }

        .animation-page {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Compact title bar replaces the big hero header */
        .animation-header {
            flex-shrink: 0;
            background: var(--color-hero-bg);
            color: #fff;
            padding: 10px 28px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .animation-header .back-link {
            font-size: 0.82rem;
            color: rgba(255, 255, 255, 0.65);
            text-decoration: none;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .animation-header .back-link:hover {
            color: #fff;
        }

        .animation-header h1 {
            font-family: var(--font-serif);
            font-size: 1rem;
            font-weight: normal;
            color: #fff;
            margin: 0;
        }

        /* Wrapper grows to fill the remaining height */
        .animation-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 10px;
            overflow: hidden;
        }

        /* height:0 + flex:1 is the key to making the iframe truly fill space */
        .animation-frame {
            flex: 1;
            height: 0;
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .animation-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* ── Mobile ─────────────────────────────────────────── */
        @media (max-width: 640px) {
            .animation-header {
                padding: 8px 12px;
                gap: 10px;
            }

            .animation-header h1 {
                font-size: 0.8rem;
                /* Hide the long subtitle on very small screens */
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .animation-wrapper {
                padding: 6px;
            }

            /* Allow horizontal scroll inside the frame so the plot is reachable */
            .animation-frame {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
        }

        /* Landscape hint shown only on portrait phones */
        .landscape-hint {
            display: none;
            background: var(--color-accent-lt);
            color: var(--color-accent-dk);
            font-size: 0.78rem;
            text-align: center;
            padding: 6px 12px;
            flex-shrink: 0;
        }

        @media (max-width: 640px) and (orientation: portrait) {
            .landscape-hint {
                display: block;
            }
        }
    </style>
</head>

<body class="animation-page">

    <!-- Navigation -->
    <nav id="navbar" role="navigation" aria-label="Main navigation">
        <div class="nav-inner">
            <a class="nav-brand" href="index.html">Regional-DSK</a>
            <ul class="nav-links">
                <li><a href="index.html#meeting-notes">Meeting Notes</a></li>
                <li><a href="index.html#slides">Slides</a></li>
                <li><a href="index.html#conferences">Conferences</a></li>
                <li><a href="https://github.com/SoniAnmol/RegionalDSKSFC" target="_blank"
                        rel="noopener noreferrer">Source Code</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Landscape hint for portrait phones -->
    <div class="landscape-hint">&#8635; Rotate to landscape for the best view</div>

    <!-- Compact header bar -->
    <div class="animation-header">
        <a class="back-link" href="index.html">&#8592; Back</a>
        <h1>Italy &ndash; Labour Supply Animation &nbsp;&middot;&nbsp; Regional-DSK 2026</h1>
    </div>

    <!-- Animation fills the rest of the viewport -->
    <div class="animation-wrapper">
        <div class="animation-frame">
            <iframe src="assets/italy_ls_animation.html" title="Italy Labour Supply Animation" allowfullscreen
                scrolling="yes">
            </iframe>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
