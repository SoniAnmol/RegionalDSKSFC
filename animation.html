<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Italy Labour Supply Animation – Regional-DSK Project">
    <meta name="author" content="Anmol Soni">
    <title>Italy Labour Supply Animation | Regional-DSK</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .animation-page {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .animation-header {
            background: var(--color-hero-bg);
            color: #fff;
            padding: 48px 0 36px;
            text-align: center;
        }

        .animation-header h1 {
            font-family: var(--font-serif);
            font-size: clamp(1.4rem, 3vw, 2rem);
            font-weight: normal;
            margin-bottom: 10px;
        }

        .animation-header p {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.04em;
        }

        .animation-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px 16px 32px;
            width: 100%;
        }

        .animation-frame {
            flex: 1;
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            height: calc(100vh - var(--nav-height) - 130px);
            min-height: 500px;
        }

        .animation-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .animation-meta {
            margin-top: 20px;
            font-size: 0.82rem;
            color: var(--color-text-muted);
            text-align: center;
        }

        .animation-meta a {
            color: var(--color-accent);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--color-accent);
            margin-bottom: 24px;
            text-decoration: none;
            transition: color var(--transition);
        }

        .back-link:hover {
            color: var(--color-accent-dk);
            text-decoration: none;
        }
    </style>
</head>

<body class="animation-page">

    <!-- Navigation -->
    <nav id="navbar" role="navigation" aria-label="Main navigation">
        <div class="nav-inner">
            <a class="nav-brand" href="index.html">Regional-DSK</a>
            <ul class="nav-links">
                <li><a href="index.html#meeting-notes">Meeting Notes</a></li>
                <li><a href="index.html#slides">Slides</a></li>
                <li><a href="index.html#conferences">Conferences</a></li>
                <li><a href="https://github.com/SoniAnmol/RegionalDSKSFC" target="_blank"
                        rel="noopener noreferrer">Source Code</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Header -->
    <div class="animation-header">
        <div class="container">
            <h1>Italy &ndash; Labour Supply Animation</h1>
            <p>Regional-DSK &nbsp;&middot;&nbsp; Working Paper 2026</p>
        </div>
    </div>

    <!-- Animation -->
    <div class="animation-wrapper">
        <a class="back-link" href="index.html">&#8592; Back to project page</a>

        <div class="animation-frame">
            <iframe src="assets/italy_ls_animation.html" title="Italy Labour Supply Animation" allowfullscreen>
            </iframe>
        </div>

        <p class="animation-meta">
            Generated with <a href="https://plotly.com/python/" target="_blank" rel="noopener noreferrer">Plotly</a>.
            &nbsp;&middot;&nbsp;
            <a href="index.html">Regional-DSK Project</a>
            &nbsp;&middot;&nbsp;
            Contact: <a href="mailto:a.soni@maastrichtuniversity.nl">a.soni@maastrichtuniversity.nl</a>
        </p>
    </div>

</body>

</html>
